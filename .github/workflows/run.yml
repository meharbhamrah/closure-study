name: run-experiment
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"   # 4 short runs a day to stay inside the 2,000 free Actions minutes
  workflow_dispatch: {}
concurrency: { group: experiment, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Gate (only run once prompts are frozen)
        id: gate
        run: |
          if [ ! -f stimuli/stimuli_final.jsonl ]; then echo "stage=none" >> "$GITHUB_OUTPUT"; echo "no final stimuli yet"
          elif [ -f FROZEN ]; then echo "stage=main" >> "$GITHUB_OUTPUT"
          else echo "stage=dry" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.stage != 'none'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run until quotas are exhausted
        if: steps.gate.outputs.stage != 'none'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          S=${{ steps.gate.outputs.stage }}
          if [ "$S" = "main" ]; then S=all; fi   # after freezing: main items plus the dry-run judge re-test
          python -u run.py init --split $S
          timeout 40m python -u run.py run --split $S --once 2>&1 | tee -a logs_$S.log || true
          python -u run.py status
          python run.py export --split main || true; python run.py export --split dry || true
      - name: Commit state
        if: always() && steps.gate.outputs.stage != 'none'
        run: |
          git config user.name "experiment-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "experiment state $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase -X ours || true
          git push || true
