name: run-experiment
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours; the runner exits cleanly when quotas are exhausted
  workflow_dispatch: {}
concurrency: { group: experiment, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run until quotas are exhausted
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run.py init
          python run.py run --once || true
          python run.py status
      - name: Commit state
        run: |
          git config user.name "experiment-bot"; git config user.email "bot@users.noreply.github.com"
          git add jobs.db results config/evidence || true
          git commit -m "experiment state $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase -X ours || true
          git push || true
