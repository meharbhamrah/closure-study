name: run-experiment
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours; the runner exits cleanly when quotas are exhausted
  workflow_dispatch: {}
concurrency: { group: experiment, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Gate (only run once prompts are frozen)
        id: gate
        run: |
          if [ -f FROZEN ] && [ -f stimuli/stimuli_final.jsonl ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Not frozen yet: skipping"; fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run until quotas are exhausted
        if: steps.gate.outputs.go == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run.py init --split main
          python run.py run --split main --once || true
          python run.py status
      - name: Commit state
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "experiment-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "experiment state $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase -X ours || true
          git push || true
