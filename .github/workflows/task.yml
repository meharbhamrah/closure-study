name: task
on:
  workflow_dispatch:
    inputs:
      command:
        description: "What to run"
        type: choice
        default: status
        options: [status, probe, dry-run]
concurrency: { group: experiment, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run task
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p logs
          case "${{ inputs.command }}" in
            probe) python -u run.py probe ;;
            dry-run) python run.py init --split dry && python run.py run --split dry --once && python run.py export --split dry && python run.py status ;;
            status) python run.py status ;;
          esac 2>&1 | tee "logs/${{ inputs.command }}.log"
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "experiment-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "task ${{ inputs.command }} $(date -u +%FT%TZ)" || echo "nothing to commit"
          git pull --rebase -X theirs || true
          git push || true
